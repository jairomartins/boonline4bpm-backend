# Trecho a integrar no server HTTPS EXISTENTE, após conferir nginx -T na VPS.
# Não substitui certificados, server_name nem document root do servidor.
location = /api {
    return 308 /api/;
}
location /api/ {
    proxy_pass http://127.0.0.1:3001/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
# Manter o fallback SPA em location / do servidor existente.
# Não configurar cache de respostas autenticadas da API.
